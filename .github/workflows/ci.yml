name: Fundgrube prüfen

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fundgrube-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Quellcode laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python bereitstellen
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tests ohne Secrets ausführen
        run: python -m unittest discover -s tests -v
      - name: JavaScript-Syntax prüfen
        run: node --check site/app.js
      - name: Oberfläche funktional prüfen
        run: node tests/test_frontend.mjs
      - name: Offline-Build prüfen
        env:
          HUNTER_SOURCE: disabled
          HUNTER_PUBLISH_LIVE_DATA: "false"
          HUNTER_LLM_ENABLED: "false"
        run: python -m hunter.pipeline --state-dir runtime-ci --site-dir site
      - name: Veröffentlichbaren Snapshot prüfen
        run: python scripts/github_snapshot.py validate --state-dir runtime-ci --site-dir site
